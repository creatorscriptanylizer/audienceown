project_id = "ownsignal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://audienceown.com"

additional_redirect_urls = [
  "https://audienceown.com/auth/callback",
  "https://audienceown.com/auth/callback?next=/onboarding",
  "https://dev.audienceown.com/auth/callback",
  "https://dev.audienceown.com/auth/callback?next=/onboarding",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/"
]

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.sms-verification]
verify_jwt = false

[functions.whatsapp-verification]
verify_jwt = false
